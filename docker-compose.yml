services:
  dependency-service:
    build:
      context: ./dependency
    container_name: ecdm-dependency
    restart: unless-stopped
    ports:
      - "8001:8001"

  app-service:
    build:
      context: ./app
    container_name: ecdm-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - dependency-service

  prometheus:
    image: prom/prometheus:latest
    container_name: ecdm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app-service

  ecdm-engine:
    build:
      context: ./engine
    container_name: ecdm-engine
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      APP_URL: http://app-service:8000
      PROMETHEUS_URL: http://prometheus:9090
      DATA_FILE: /data/experiment_results_confirmatory.csv
      RECOVERY_HISTORY_FILE: /data/recovery_history_confirmatory.json
      CAMPAIGN_FILE: /data/campaign_results_confirmatory.csv
      REFERENCE_POLICY_FILE: /engine/reference_policy.json
      HDCM_ALPHA: "0.25"
      HDCM_BETA: "0.25"
      HDCM_GAMMA: "0.25"
      HDCM_DELTA: "0.25"
      HDCM_AGGREGATION_MODE: multiplicative
      RECOVERY_PRIOR_ALPHA: "1.0"
      RECOVERY_PRIOR_BETA: "1.0"
      MIN_AUTONOMOUS_CONFIDENCE: "0.55"
      MIN_CONFIDENCE_MARGIN: "0.03"
      RECOVERY_REQUIRED_CONSECUTIVE_CHECKS: "3"
      RECOVERY_VERIFICATION_MAX_ATTEMPTS: "20"
      RECOVERY_VERIFICATION_INTERVAL_SECONDS: "0.5"
      ACTION_EXECUTION_MODE: prototype_fault_reset
    volumes:
      - ./data:/data
    depends_on:
      - app-service
      - prometheus

  dashboard:
    build:
      context: ./dashboard
    container_name: ecdm-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      ECDM_ENGINE_URL: http://ecdm-engine:8100
    depends_on:
      - ecdm-engine

  analysis:
    build:
      context: ./analysis
    container_name: ecdm-analysis
    volumes:
      - ./data:/data
    profiles:
      - analysis

